name: Validate and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/textures.py --check
      - run: python -m unittest discover -s tests -v
      - run: node --check mod/ui/modules/apps/BeamngWeatherHashk014/app.js
      - run: node tests/test_ui.js
      - uses: actions/upload-artifact@v4
        with:
          name: beamng-weather-mod
          path: |
            dist/beamng_weather_hashk014.zip
            dist/SHA256SUMS.txt
